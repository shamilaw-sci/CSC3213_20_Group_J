name: Backend Checks
on:
  pull_request:
  push:
    branches: [main, developer]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: testpassword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Test backend
        working-directory: icrowd_api
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Verify fresh database and repeatable upgrade
        run: |
          psql -h localhost -U testuser -d testdb -v ON_ERROR_STOP=1 -f database_setup.sql
          psql -h localhost -U testuser -d testdb -v ON_ERROR_STOP=1 -f database_migrations/20261115_security_performance.sql
          psql -h localhost -U testuser -d testdb -v ON_ERROR_STOP=1 -f database_migrations/20261115_security_performance.sql
      - name: Validate application mappings against PostgreSQL
        working-directory: icrowd_api
        run: >-
          ./mvnw -B -Dtest=IcrowdApiApplicationTests
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/testdb
          -Dspring.datasource.username=testuser -Dspring.datasource.password=testpassword
          -Dspring.jpa.hibernate.ddl-auto=validate test
      - name: Verify legacy empty database upgrade
        run: |
          createdb -h localhost -U testuser legacydb
          psql -h localhost -U testuser -d legacydb -v ON_ERROR_STOP=1 -f icrowd_api/src/test/resources/legacy-bootstrap.sql
          psql -h localhost -U testuser -d legacydb -v ON_ERROR_STOP=1 -f database_migrations/20261115_security_performance.sql
      - name: Validate upgraded database mappings
        working-directory: icrowd_api
        run: >-
          ./mvnw -B -Dtest=IcrowdApiApplicationTests
          -Dspring.datasource.url=jdbc:postgresql://localhost:5432/legacydb
          -Dspring.datasource.username=testuser -Dspring.datasource.password=testpassword
          -Dspring.jpa.hibernate.ddl-auto=validate test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-results
          path: icrowd_api/target/surefire-reports/
