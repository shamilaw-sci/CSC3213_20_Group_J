name: E2E Integration Checks

on:
  pull_request:
    branches: [ "developer" ]

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    # 1. Set up environments
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './iCrowd_UI/package-lock.json'
        
    # 2. Boot the backend server in the background
    - name: Start Spring Boot API
      working-directory: ./icrowd_api
      run: >
        chmod +x mvnw &&
        ./mvnw spring-boot:run 
        -Dspring-boot.run.arguments="--spring.datasource.url=jdbc:postgresql://localhost:5432/testdb --spring.datasource.username=testuser --spring.datasource.password=testpassword" &
      # Wait a bit for Spring Boot to actually start accepting requests on 8080
    - name: Wait for API to boot
      run: sleep 30

    # 3. Install frontend deps and run Playwright
    - name: Install Frontend Dependencies
      working-directory: ./iCrowd_UI
      run: npm ci

    - name: Install Playwright Browsers
      working-directory: ./iCrowd_UI
      run: npx playwright install --with-deps chromium
      
    - name: Run Playwright Tests
      working-directory: ./iCrowd_UI
      run: npm run test:e2e
      
    # Optional: Upload test results if it fails
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: ./iCrowd_UI/playwright-report/
        retention-days: 10
