name: Browser Checks
on:
  pull_request:
  push:
    branches: [main, developer]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: iCrowd_UI/package-lock.json
      - name: Build isolated local API
        working-directory: icrowd_api
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
      - name: Start API and wait for a successful catalog response
        working-directory: icrowd_api
        env:
          SPRING_PROFILES_ACTIVE: local
          JWT_SECRET: ci-only-random-signing-material-not-for-production-2026
          MARKETING_ENABLED: 'false'
        run: |
          java -jar target/icrowd-backend-*.jar > target/browser-api.log 2>&1 &
          echo $! > target/browser-api.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/api/products?size=1 > /dev/null; then exit 0; fi
            if ! kill -0 "$(cat target/browser-api.pid)" 2>/dev/null; then cat target/browser-api.log; exit 1; fi
            sleep 2
          done
          cat target/browser-api.log
          exit 1
      - run: npm ci
        working-directory: iCrowd_UI
      - run: npx playwright install --with-deps chromium
        working-directory: iCrowd_UI
      - run: npm run build
        working-directory: iCrowd_UI
      - run: npm run test:e2e
        working-directory: iCrowd_UI
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            iCrowd_UI/playwright-report/
            icrowd_api/target/browser-api.log
          retention-days: 10
