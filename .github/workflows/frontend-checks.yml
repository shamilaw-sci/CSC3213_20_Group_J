name: Frontend Checks

on:
  pull_request:
    branches: [ "developer" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Set default working directory to the frontend folder
    defaults:
      run:
        working-directory: ./iCrowd_UI

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './iCrowd_UI/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build Verification
      run: npm run build
