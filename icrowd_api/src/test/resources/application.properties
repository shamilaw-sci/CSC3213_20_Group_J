spring.application.name=icrowd_api-test

# Use in-memory H2 database with PostgreSQL compatibility for testing (can be overridden by CI)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=

# Hibernate DDL Auto
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false


jwt.secret=isolated-test-signing-key-not-for-deployment-2026
app.marketing.enabled=false
app.cors.allowed-origins=http://localhost:5173
