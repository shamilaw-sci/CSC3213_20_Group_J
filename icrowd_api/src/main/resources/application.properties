spring.application.name=icrowd_api

# Database Connection Settings (Falls back to H2 in-memory database for local dev)
spring.datasource.url=${DB_URL:jdbc:h2:mem:icrowddb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}



# Hibernate DDL Auto (Use 'create' to wipe old tables, 'update' to persist)
spring.jpa.hibernate.ddl-auto=create