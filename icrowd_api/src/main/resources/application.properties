spring.application.name=icrowd_api
spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:8080}

# ── Persistent database (required outside local/test profiles) ─────────────────
# Set these as environment variables or in a local .env file (never commit secrets!)
# Required env vars: DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Hibernate ────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Frontend URL for payment redirects ────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# PayHere hosted checkout (sandbox by default)
payhere.sandbox=${PAYHERE_SANDBOX:true}
payhere.merchant-id=${PAYHERE_MERCHANT_ID:}
payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET:}
payhere.notify-url=${PAYHERE_NOTIFY_URL:}
# Optional Merchant API credentials for automatic refunds
payhere.app-id=${PAYHERE_APP_ID:}
payhere.app-secret=${PAYHERE_APP_SECRET:}

# Homepage banner uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ── JWT Configuration ──────────────────────────────────────────────────────────
# Secret must be at least 256 bits (32 bytes). Override in production via JWT_SECRET env var.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Initial Demonstration Accounts (Non-Production Only) ────────────────────────
app.default-admin.email=${DEFAULT_ADMIN_EMAIL:admin@icrowd.com}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:}
app.default-customer.email=${DEFAULT_CUSTOMER_EMAIL:customer@icrowd.com}
app.default-customer.password=${DEFAULT_CUSTOMER_PASSWORD:}

# Targeted marketing: delivery is OFF until the owner configures and enables it.
app.marketing.enabled=${MARKETING_ENABLED:false}
app.marketing.from=${SMTP_FROM:}
app.marketing.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.marketing.public-api-url=${PUBLIC_API_URL:http://localhost:8080}
app.marketing.daily-limit=${MARKETING_DAILY_LIMIT:100}
app.marketing.weekly-customer-limit=${MARKETING_WEEKLY_CUSTOMER_LIMIT:2}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend.url}}
spring.jpa.properties.hibernate.default_batch_fetch_size=64
