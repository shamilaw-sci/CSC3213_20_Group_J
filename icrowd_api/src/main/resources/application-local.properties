# Explicit disposable local environment. Supply JWT_SECRET before starting.
spring.datasource.url=jdbc:h2:mem:icrowdlocal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
